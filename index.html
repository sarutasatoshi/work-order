<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業指示書">
<meta name="theme-color" content="#2b3f63">
<title>作業指示書</title>
<style>
  :root { --main:#2b3f63; --accent:#c9771a; --bg:#eceff3; --line:#d3d9e0; --text:#1d2329; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
         -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; background:var(--main); color:#fff;
           padding:calc(env(safe-area-inset-top) + 10px) 12px 10px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.6); border-radius:8px; padding:7px 12px; font-size:14px; font-weight:600; }
  main { max-width:720px; margin:0 auto; padding:8px 10px 120px; }

  /* ===== 一覧 ===== */
  .hbar { display:flex; gap:8px; margin:6px 0 12px; }
  .hbar input { margin:0; flex:1; min-width:0; }
  .hbar .btn { white-space:nowrap; font-weight:700; }
  .card { display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px; padding:10px; margin-bottom:8px;
          box-shadow:0 1px 3px rgba(0,0,0,.12); cursor:pointer; -webkit-tap-highlight-color:rgba(43,63,99,.12); }
  .cimg { width:60px; height:60px; flex:none; border-radius:8px; background:#eef1f4 center/cover no-repeat;
          display:flex; align-items:center; justify-content:center; font-size:24px; color:#9aa4ad; }
  .cbody { flex:1; min-width:0; }
  .ctitle { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctitle.faint { color:#8a959f; font-weight:600; }
  .csub { font-size:12.5px; color:#5f6b75; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; margin-top:4px; background:#eef1f4; color:#5f6b75; }
  .badge.ok { background:#e3f2ea; color:#2f7d5b; }
  .badge.warn { background:#fdf0dc; color:#a86412; }
  .cmore { flex:none; border:none; background:transparent; font-size:22px; padding:6px 10px; color:#5f6b75; }
  .empty { text-align:center; color:#6b7680; font-size:14px; padding:40px 10px; line-height:1.7; white-space:pre-line; }

  /* ===== 入力画面 ===== */
  .fs { background:#fff; border-radius:12px; padding:4px 12px 14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .fs h2 { font-size:15px; margin:10px 0 2px; color:var(--main); display:flex; align-items:baseline; gap:8px; }
  label { display:block; font-size:12.5px; color:#56616b; margin-top:10px; }
  input[type=text], input[type=date], input[type=time], input[type=search], textarea {
         display:block; width:100%; margin-top:3px; font-size:16px; padding:9px 10px; min-height:42px;
         border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); font-family:inherit; -webkit-appearance:none; appearance:none; }
  textarea { resize:vertical; line-height:1.55; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .inrow { display:flex; gap:6px; align-items:stretch; margin-top:3px; }
  .inrow input, .inrow textarea { margin-top:0; flex:1; min-width:0; }
  .mapbtn { flex:none; border:1px solid var(--line); background:#f4f7fa; border-radius:8px; padding:0 10px; font-size:13px; color:var(--main); font-weight:600; }
  .cnt { font-size:11.5px; color:#7a858f; font-weight:400; margin-left:auto; }
  .cnt.over { color:#c0392b; font-weight:700; }
  .cnt.warn { color:#a86412; font-weight:700; }
  .note-s { font-size:11.5px; color:#7a858f; margin:6px 0 0; line-height:1.5; }

  .mat { display:grid; grid-template-columns:auto 1fr auto; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid #eef1f4; }
  .mat input.mname { margin:0; }
  .mchk { border:1.5px solid #b9c2cb; background:#fff; color:#5f6b75; border-radius:8px; padding:9px 8px; font-size:13px; font-weight:700; white-space:nowrap; min-width:76px; }
  .mchk.on { border-color:#2f7d5b; background:#e3f2ea; color:#2f7d5b; }
  .mdel { border:none; background:transparent; font-size:18px; color:#9aa4ad; padding:6px 6px; }
  .mdl { grid-column:2 / 4; margin:0; display:flex; align-items:center; gap:8px; font-size:13px; color:#2f7d5b; }
  .mdl[hidden] { display:none; }
  .mdl input { margin:0; width:auto; flex:1; min-height:36px; padding:6px 8px; }

  .phgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; margin-top:10px; }
  .pcard { background:#f6f8fa; border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; }
  .pcard .pim { aspect-ratio:4/3; background:#dde3e8 center/contain no-repeat; }
  .pcard .pno { font-size:12px; font-weight:700; padding:5px 8px 0; color:var(--main); }
  .pcard .pmemo { font-size:12px; padding:2px 8px 7px; color:#4a5560; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pcard .pmemo.faint { color:#9aa4ad; }

  .bbar { position:fixed; left:0; right:0; bottom:0; z-index:6; background:rgba(255,255,255,.96); border-top:1px solid var(--line);
          padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); display:flex; gap:10px; justify-content:center; }
  .bbar .btn { flex:1; max-width:340px; font-weight:700; }

  .btn { font-size:15px; padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--text); cursor:pointer; }
  .btn.primary { background:var(--main); color:#fff; border-color:var(--main); }
  .btn.accent { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.danger { color:#c0392b; }
  .btn.wide { display:block; width:100%; margin-top:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .row .btn { flex:1; }

  .modal { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:12px; }
  .modal[hidden] { display:none; }
  .modal.full { align-items:flex-start; padding:calc(env(safe-area-inset-top) + 8px) 8px 8px; }
  .modal-body { background:#fff; border-radius:14px; padding:12px 14px; width:100%; max-width:900px; max-height:100%; overflow:auto; }
  .modal-body.small { max-width:420px; }
  .modal-body.form { max-width:560px; padding-bottom:calc(env(safe-area-inset-bottom) + 14px); }
  .modal-body h3 { margin:4px 0 8px; font-size:17px; }
  .modal-body p { font-size:14px; line-height:1.6; margin:0 0 10px; word-break:break-all; }
  .mhead { display:flex; align-items:center; gap:8px; position:sticky; top:-12px; background:#fff; padding:6px 0; z-index:1; }
  .mhead h3 { flex:1; text-align:center; margin:0; }
  .mhead .btn { padding:8px 12px; }
  .cthumb { text-align:center; margin:6px 0 2px; }
  .cthumb img { max-width:100%; max-height:30vh; border-radius:8px; }
  .menu button { display:block; width:100%; text-align:left; margin-bottom:8px; }
  .menu .desc { display:block; font-size:12px; color:#7a858f; margin-top:2px; font-weight:400; }
  .menu .btn.primary .desc, .menu .btn.accent .desc { color:rgba(255,255,255,.85); }
  .pv canvas { display:block; width:100%; height:auto; margin:0 auto 12px; box-shadow:0 1px 5px rgba(0,0,0,.3); background:#fff; }
  .pvcap { font-size:12.5px; color:#5f6b75; margin:2px 0 4px; }
  #toast { position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:rgba(20,20,20,.88); color:#fff; padding:10px 16px;
           border-radius:10px; font-size:14px; z-index:30; max-width:90vw; display:none; }
  #busy { position:fixed; inset:0; z-index:40; background:rgba(255,255,255,.75); display:none; align-items:center; justify-content:center; font-size:16px; font-weight:600; }
</style>
</head>
<body>
<header>
  <button id="btnBack" hidden>◀ 一覧</button>
  <h1 id="hTitle">作業指示書</h1>
  <button id="btnMore" hidden>⋯</button>
</header>

<!-- 一覧（最初の画面） -->
<main id="home">
  <div class="hbar">
    <input type="search" id="q" placeholder="🔍 工事名・客先・日付などで検索">
    <button class="btn primary" id="btnCreate">＋ 新規作成</button>
  </div>
  <div id="list"></div>
</main>

<!-- 入力画面 -->
<main id="edit" hidden>
  <div class="fs">
    <h2>基本</h2>
    <div class="grid2">
      <label>作成日<input type="date" data-k="makeDate"></label>
      <label>作成者<input type="text" data-k="author" placeholder="例：山田"></label>
    </div>
    <label>工事名<input type="text" data-k="koji" placeholder="例：○○工場 排気ダクト改修工事"></label>
    <div class="grid2">
      <label>作業日<input type="date" data-k="workDate"></label>
      <label>終了日（複数日のとき）<input type="date" data-k="workDateEnd"></label>
    </div>
    <div class="grid2">
      <label>集合時間<input type="time" data-k="meetTime"></label>
      <label>使用車両<input type="text" data-k="car" placeholder="例：ハイエース"></label>
    </div>
    <label>集合場所<div class="inrow"><input type="text" data-k="meetPlace" placeholder="例：会社 / 現地"><button class="mapbtn" data-map="meetPlace">🗺 地図</button></div></label>
    <label>作業人員<input type="text" data-k="members" placeholder="例：4名（山田・佐藤・協力会社2名）"></label>
  </div>

  <div class="fs">
    <h2>関係先</h2>
    <label>元請 <span class="cnt" data-cnt="motouke"></span><textarea rows="2" data-k="motouke" placeholder="例：○○建設(株)"></textarea></label>
    <label>担当者／連絡先 <span class="cnt" data-cnt="tanto"></span><textarea rows="2" data-k="tanto" placeholder="例：鈴木様 090-xxxx-xxxx"></textarea></label>
    <label>客先 <span class="cnt" data-cnt="kyaku"></span><textarea rows="2" data-k="kyaku" placeholder="例：○○株式会社 △△工場"></textarea></label>
    <label>客先住所 <span class="cnt" data-cnt="address"></span><div class="inrow"><textarea rows="2" data-k="address" placeholder="例：神奈川県○○市…"></textarea><button class="mapbtn" data-map="address">🗺 地図</button></div></label>
    <label>駐車場 <span class="cnt" data-cnt="parking"></span><div class="inrow"><textarea rows="2" data-k="parking" placeholder="例：構内 第2駐車場（守衛所で受付）"></textarea><button class="mapbtn" data-map="parking">🗺 地図</button></div></label>
    <label>協力会社 <span class="cnt" data-cnt="kyoryoku"></span><textarea rows="2" data-k="kyoryoku" placeholder="例：○○設備 2名"></textarea></label>
  </div>

  <div class="fs">
    <h2>作業内容 <span class="cnt" data-cnt="naiyo"></span></h2>
    <textarea rows="8" data-k="naiyo" placeholder="例：&#10;・既設ダクト撤去（2F 408室）&#10;・新設ダクト取付 φ200 ×12m"></textarea>
  </div>

  <div class="fs">
    <h2>発注部材 <span class="cnt" data-cnt="mats"></span></h2>
    <p class="note-s" style="margin-top:2px">発注したら「未発注」をタップ → ✓と今日の日付が入ります。</p>
    <div id="mats"></div>
    <button class="btn wide" id="matAdd">＋ 部材を追加</button>
  </div>

  <div class="fs">
    <h2>準備資機材 <span class="cnt" data-cnt="shizai"></span></h2>
    <textarea rows="8" data-k="shizai" placeholder="例：&#10;・脚立 6尺 ×2&#10;・インパクト、ディスクグラインダー"></textarea>
  </div>

  <div class="fs">
    <h2>備考 <span class="cnt" data-cnt="biko"></span></h2>
    <textarea rows="3" data-k="biko" placeholder="例：入構時に安全靴・ヘルメット必須"></textarea>
  </div>

  <div class="fs">
    <h2>現場写真 <span class="cnt" id="phCnt"></span></h2>
    <p class="note-s" style="margin-top:2px">2ページ目以降に1ページ4枚で入ります。写真をタップ → メモ・回転・並べ替え・削除。</p>
    <div class="phgrid" id="phGrid"></div>
    <div class="row">
      <button class="btn" id="btnShot">📷 撮影する</button>
      <button class="btn" id="btnPick">🖼 写真を選ぶ</button>
    </div>
  </div>
</main>

<div class="bbar" id="bbar" hidden>
  <button class="btn" id="btnPreview">👁 仕上がりを見る</button>
  <button class="btn accent" id="btnOut">📤 送る・保存</button>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" multiple hidden>

<!-- ボタンが並ぶ小さなメニュー -->
<div class="modal" id="sheet" hidden>
  <div class="modal-body small menu">
    <h3 id="shTitle"></h3>
    <div id="shBtns"></div>
  </div>
</div>

<!-- 写真のメモ -->
<div class="modal full" id="memo" hidden>
  <div class="modal-body form">
    <div class="mhead">
      <button class="btn" id="mPrev">◀ 前</button>
      <h3 id="mHead"></h3>
      <button class="btn" id="mNext">次 ▶</button>
    </div>
    <div class="cthumb"><img id="mImg" alt=""></div>
    <label>メモ <span class="cnt" id="mCnt"></span><textarea id="mText" rows="6" placeholder="例：既設ダクト。ここから先を撤去"></textarea></label>
    <button class="btn primary wide" id="mDone">完了</button>
  </div>
</div>

<!-- 仕上がり（PDFと同じ見た目） -->
<div class="modal full" id="preview" hidden>
  <div class="modal-body">
    <div class="mhead"><h3 style="text-align:left">仕上がり</h3><button class="btn" id="pvClose">✕ 閉じる</button></div>
    <div class="pv" id="pvBox"></div>
  </div>
</div>

<!-- 出力 -->
<div class="modal" id="ready" hidden>
  <div class="modal-body small menu">
    <h3>PDFとExcelができました</h3>
    <p id="readyMsg"></p>
    <button class="btn accent" id="rBoth">📧 PDFとExcelを送る<span class="desc">メールなら2つとも添付されます</span></button>
    <button class="btn" id="rPdf">📄 PDFだけ送る<span class="desc">LINEなどで送るときはこちら</span></button>
    <button class="btn" id="rXlsx">📊 Excelだけ送る</button>
    <button class="btn" id="rDl">💾 この端末に保存（ダウンロード）</button>
    <button class="btn" id="rClose">閉じる</button>
  </div>
</div>

<div id="toast"></div>
<div id="busy">作成中…</div>

<script>
'use strict';
/* ================= 基本 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const WD = '日月火水木金土';
const ymd = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); if (!y) return null; return { y, m, d, w: WD[new Date(y, m - 1, d).getDay()] }; };
const jpDate = s => { const a = ymd(s); return a ? `${a.y}年${a.m}月${a.d}日` : ''; };
function workDateStr(f) {
  const a = ymd(f.workDate); if (!a) return '';
  let s = `${a.y}年${a.m}月${a.d}日(${a.w})`;
  const b = ymd(f.workDateEnd);
  if (b && f.workDateEnd !== f.workDate) s += '〜' + (b.y !== a.y ? `${b.y}年${b.m}月${b.d}日` : b.m !== a.m ? `${b.m}月${b.d}日` : `${b.d}日`) + `(${b.w})`;
  return s;
}
const timeStr = t => { if (!t) return ''; const [h, m] = t.split(':'); return `${+h}:${m}`; };

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms);
}
function busy(on, msg = '作成中…') { const b = $('#busy'); b.textContent = msg; b.style.display = on ? 'flex' : 'none'; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const toBlob = (cv, type, q) => new Promise(r => cv.toBlob(r, type, q));

/* ================= 保存（端末内のみ） ================= */
const DOC_KEY = 'workOrder.docs.v1';
const SET_KEY = 'workOrder.settings.v1';
let cfg = { author: '' };
let docs = [];
let cur = null;     // 開いている指示書
let photos = [];    // 開いている指示書の写真
const newDoc = o => Object.assign({ id: uid(), created: Date.now(), updated: Date.now(), exported: 0, count: 0, thumb: '', thumbKey: '',
  f: { makeDate: todayStr(), author: cfg.author || '' }, mats: [] }, o);
function loadStore() {
  try { const c = JSON.parse(localStorage.getItem(SET_KEY)); if (c) cfg = Object.assign(cfg, c); } catch (e) {}
  try { const d = JSON.parse(localStorage.getItem(DOC_KEY)); if (Array.isArray(d)) docs = d; } catch (e) {}
}
const saveCfg = () => { try { localStorage.setItem(SET_KEY, JSON.stringify(cfg)); } catch (e) {} };
function saveDocs() { try { localStorage.setItem(DOC_KEY, JSON.stringify(docs)); } catch (e) { toast('保存に失敗しました: ' + e.message); } }
const saveDocsLater = debounce(saveDocs, 400);
function touch() { if (!cur) return; cur.updated = Date.now(); saveDocsLater(); }

let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('workOrder', 1);
    r.onupgradeneeded = () => { const s = r.result.createObjectStore('photos', { keyPath: 'id' }); s.createIndex('rid', 'rid'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('photos', mode); const req = fn(t.objectStore('photos')); let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbPut = p => tx('readwrite', s => s.put(p));
const dbDel = id => tx('readwrite', s => s.delete(id));
const dbByRid = rid => tx('readonly', s => s.index('rid').getAll(rid));
const dbDelRid = rid => tx('readwrite', s => {
  const req = s.index('rid').openKeyCursor(IDBKeyRange.only(rid));
  req.onsuccess = () => { const c = req.result; if (c) { s.delete(c.primaryKey); c.continue(); } };
});
const sortedPhotos = () => photos.slice().sort((a, b) => a.order - b.order);

/* ================= 画像 ================= */
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('画像を開けません')); i.src = src; });
}
const imgCache = new Map();
function getImg(p) {
  if (!imgCache.has(p.id)) imgCache.set(p.id, loadImg(URL.createObjectURL(p.blob)));
  return imgCache.get(p.id);
}
// 撮影画像を長辺1800pxのJPEGに縮小して保存（向きはブラウザが補正）
async function normalizeImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return { blob: await toBlob(c, 'image/jpeg', 0.88), w, h };
  } finally { URL.revokeObjectURL(url); }
}
// 回転を反映した画像
async function compose(p, maxSide) {
  const img = await getImg(p);
  const rot = p.rot || 0, sw = img.naturalWidth, sh = img.naturalHeight;
  const W = rot % 180 ? sh : sw, H = rot % 180 ? sw : sh;
  const k = maxSide ? Math.min(1, maxSide / Math.max(W, H)) : 1;
  const cw = Math.round(W * k), ch = Math.round(H * k);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  g.translate(cw / 2, ch / 2); g.rotate(rot * Math.PI / 180);
  const dw = rot % 180 ? ch : cw, dh = rot % 180 ? cw : ch;
  g.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  return c;
}
const thumbs = new Map(); // `${id}:${v}:${rot}` → Promise<URL>
function thumbOf(p) {

        const s = st.xf({ kind: v ? v.k : null, border: e || {} }), ref = colName(c) + r;
        cx += v && v.text ? `<c r="${ref}" s="${s}" t="s"><v>${sIdx(v.text)}</v></c>` : `<c r="${ref}" s="${s}"/>`;
      }
      // iPhoneのプレビューは「値が入っている最後の行」までしか表示しないため、印刷範囲の外に見えない値を置く
      if (r === ROWS) cx += `<c r="${colName(COLS + 1)}${r}" s="${S_HID}"><v>0</v></c>`;
      rowsXml += `<row r="${r}" ht="15" customHeight="1">${cx}</row>`;
    }
    // 写真
    const anchors = [], drawRels = [];
    for (const im of pg.imgs) {
      if (!im.cv) continue;
      const bytes = new Uint8Array(await (await toBlob(im.cv, 'image/jpeg', 0.85)).arrayBuffer());
      imgNo++; media.push({ name: `xl/media/image${imgNo}.jpeg`, data: bytes });
      const x0 = (im.c - 1) * COL_PX, y0 = (im.r - 1) * ROW_PX;
      const bw = (im.c2 - im.c + 1) * COL_PX, bh = (im.r2 - im.r + 1) * ROW_PX;
      const s = Math.min((bw - 8) / im.cv.width, (bh - 8) / im.cv.height);
      const w = Math.round(im.cv.width * s), h = Math.round(im.cv.height * s);
      const x = x0 + (bw - w) / 2, y = y0 + (bh - h) / 2;
      const at = (pos, size) => { const i = Math.floor(pos / size); return { i, off: pos - i * size }; };
      const f1 = at(x, COL_PX), f2 = at(x + w, COL_PX), r1 = at(y, ROW_PX), r2 = at(y + h, ROW_PX);
      const rid = `rId${drawRels.length + 1}`, n = anchors.length + 1;
      drawRels.push(`<Relationship Id="${rid}" Type="${NSR}/image" Target="../media/image${imgNo}.jpeg"/>`);
      anchors.push(
        '<xdr:twoCellAnchor editAs="oneCell">' +
        `<xdr:from><xdr:col>${f1.i}</xdr:col><xdr:colOff>${EMU(f1.off)}</xdr:colOff><xdr:row>${r1.i}</xdr:row><xdr:rowOff>${EMU(r1.off)}</xdr:rowOff></xdr:from>` +
        `<xdr:to><xdr:col>${f2.i}</xdr:col><xdr:colOff>${EMU(f2.off)}</xdr:colOff><xdr:row>${r2.i}</xdr:row><xdr:rowOff>${EMU(r2.off)}</xdr:rowOff></xdr:to>` +
        `<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${n + 1}" name="図 ${n}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>` +
        `<xdr:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>` +
        `<xdr:spPr><a:xfrm><a:off x="${EMU(x)}" y="${EMU(y)}"/><a:ext cx="${EMU(w)}" cy="${EMU(h)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>` +
        '</xdr:pic><xdr:clientData/></xdr:twoCellAnchor>');
    }
    files.push({ name: `xl/worksheets/sheet${sn}.xml`, data: HEAD +
      `<worksheet xmlns="${NS}" xmlns:r="${NSR}"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:${colName(COLS + 1)}${ROWS}"/>` +
      `<sheetViews><sheetView showGridLines="0"${pi === 0 ? ' tabSelected="1"' : ''} workbookViewId="0"/></sheetViews>` +
      '<sheetFormatPr defaultColWidth="2.5" defaultRowHeight="15" customHeight="1"/>' +
      `<cols><col min="1" max="${COLS + 1}" width="${COL_W}" customWidth="1"/></cols>` +
      `<sheetData>${rowsXml}</sheetData>` +
      (merges.length ? `<mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '') +
      '<printOptions horizontalCentered="1"/>' +
      '<pageMargins left="0.433" right="0.433" top="0.354" bottom="0.354" header="0.315" footer="0.315"/>' +
      '<pageSetup paperSize="9" fitToWidth="1" fitToHeight="1" orientation="portrait"/>' +
      (anchors.length ? '<drawing r:id="rId1"/>' : '') + '</worksheet>' });
    if (anchors.length) {
      files.push({ name: `xl/worksheets/_rels/sheet${sn}.xml.rels`, data: HEAD +
        `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${NSR}/drawing" Target="../drawings/drawing${sn}.xml"/></Relationships>` });
      files.push({ name: `xl/drawings/drawing${sn}.xml`, data: HEAD +
        `<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="${NSR}">${anchors.join('')}</xdr:wsDr>` });
      files.push({ name: `xl/drawings/_rels/drawing${sn}.xml.rels`, data: HEAD +
        `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${drawRels.join('')}</Relationships>` });
    }
  }
  const n = names.length;
  const hasDrawing = i => files.some(f => f.name === `xl/drawings/drawing${i}.xml`);
  const head = [
    { name: '[Content_Types].xml', data: HEAD +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      names.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>` +
        (hasDrawing(i + 1) ? `<Override PartName="/xl/drawings/drawing${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>` : '')).join('') +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>' +
      '</Types>' },
    { name: '_rels/.rels', data: HEAD +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${NSR}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: HEAD +
      `<workbook xmlns="${NS}" xmlns:r="${NSR}"><bookViews><workbookView/></bookViews><sheets>` +
      names.map((s, i) => `<sheet name="${xmlEsc(s)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets><definedNames>' +
      names.map((s, i) => `<definedName name="_xlnm.Print_Area" localSheetId="${i}">'${xmlEsc(s)}'!$A$1:$${colName(COLS)}$${ROWS}</definedName>`).join('') +
      '</definedNames></workbook>' },
    { name: 'xl/_rels/workbook.xml.rels', data: HEAD +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      names.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${NSR}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
      `<Relationship Id="rId${n + 1}" Type="${NSR}/styles" Target="styles.xml"/>` +
      `<Relationship Id="rId${n + 2}" Type="${NSR}/sharedStrings" Target="sharedStrings.xml"/></Relationships>` },
    { name: 'xl/styles.xml', data: st.xml() },
    { name: 'xl/sharedStrings.xml', data: HEAD +
      `<sst xmlns="${NS}" count="${sst.length}" uniqueCount="${sst.length}">` +
      sst.map(s => `<si><t xml:space="preserve">${xmlEsc(s)}</t></si>`).join('') + '</sst>' },
  ];
  return zipStore([...head, ...files, ...media]);
}

      const n = linesFor(cur, key).length;
      txt = `${n}/2行`; if (n > 2) { txt += '（2行目の文字が小さくなります）'; cls = 'over'; }
    } else {

  const warn = d.exported ? '' : '\n\n※この指示書はまだ送信・保存していません。';
  if (!confirm(`「${d.f.koji || '（工事名なし）'}」を削除しますか？\n写真も消え、元に戻せません。${warn}`)) return;
  try { await dbDelRid(id); } catch (e) { toast('削除に失敗しました: ' + e.message); return; }
  docs = docs.filter(x => x !== d); saveDocs();
  cur = null; photos = []; showView('home'); renderList(); toast('削除しました');
}
function renderList() {
  const words = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hay = d => {
    const a = ymd(d.f.workDate);
    return [...Object.values(d.f), workDateStr(d.f), a ? `${a.m}/${a.d}` : '', ...d.mats.map(m => m.name)].join(' ').toLowerCase();
  };
  const shown = docs.slice().sort((a, b) => b.updated - a.updated).filter(d => words.every(w => hay(d).includes(w)));
  const list = $('#list'); list.innerHTML = '';
  if (!docs.length) { list.appendChild(el('p', 'empty', 'まだ作業指示書がありません。\n右上の「＋ 新規作成」から始めてください。')); return; }
  if (!shown.length) { list.appendChild(el('p', 'empty', '見つかりませんでした')); return; }
  for (const d of shown) {
    const card = el('div', 'card'); card.dataset.id = d.id;
    const im = el('div', 'cimg', d.thumb ? '' : '📋');
    if (d.thumb) im.style.backgroundImage = `url("${d.thumb}")`;
    const body = el('div', 'cbody');
    body.appendChild(el('div', 'ctitle' + (d.f.koji ? '' : ' faint'), d.f.koji || '（工事名なし）'));
    body.appendChild(el('div', 'csub', '作業日：' + (workDateStr(d.f) || '未定') + (d.f.meetTime ? `　集合 ${timeStr(d.f.meetTime)}` : '')));
    if (d.f.kyaku) body.appendChild(el('div', 'csub', d.f.kyaku.replace(/\n/g, ' ')));
    const changed = d.exported && d.updated > d.exported + 2000;
    body.appendChild(el('span', 'badge' + (d.exported ? changed ? ' warn' : ' ok' : ''),
      d.exported ? changed ? '送信後に変更あり' : '✓ 送信・保存済み' : '未送信'));
    const more = el('button', 'cmore', '⋯'); more.dataset.more = '1';
    card.append(im, body, more); list.appendChild(card);
  }
}
$('#list').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id, d = docs.find(x => x.id === id);
  if (!e.target.closest('[data-more]')) return openDoc(id);
  actionSheet(d.f.koji || '（工事名なし）', add => {
    add('開く', '', () => openDoc(id), 'primary');
    add('📄 複製して新しく作る', '写真以外をコピーします（作業日は空、部材は未発注に戻ります）', () => duplicateDoc(id));
    add('🗑 削除', '元に戻せません', () => deleteDoc(id), 'danger');
    add('閉じる', '', null);
  });
});
$('#btnMore').addEventListener('click', () => {
  const id = cur.id;
  actionSheet('この作業指示書', add => {
    add('📄 複製して新しく作る', '写真以外をコピーします（作業日は空、部材は未発注に戻ります）', () => duplicateDoc(id));
    add('🗑 この作業指示書を削除', '元に戻せません', () => deleteDoc(id), 'danger');
    add('閉じる', '', null);
  });
});
$('#q').addEventListener('input', debounce(renderList, 150));
$('#btnCreate').addEventListener('click', createDoc);
$('#btnBack').addEventListener('click', goHome);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveDocs(); });

/* ================= 起動 ================= */
loadStore();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
showView('home'); renderList();
</script>
</body>
</html>
